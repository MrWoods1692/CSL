[package]
name = "csl-mc1-19-4"
version = "0.1.0"
edition = "2021"
description = "CSL Web Runner - Minecraft 1.19.4 WASM Module"

[lib]
crate-type = ["cdylib"]

[dependencies]
wasm-bindgen = "0.2"
csl-wasm-core = { path = "../../wasm-core" }

[package.metadata.wasm-pack.profile.release]
wasm-opt = false

[profile.release]
opt-level = "s"
lto = true