<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32" shape-rendering="crispEdges">
  <!-- 钻石剑光标 (Minecraft 风格像素艺术) -->
  <!-- 剑柄缠绕物 (棕色) -->
  <rect x="4" y="22" width="2" height="2" fill="#5a3a1a"/>
  <rect x="6" y="20" width="2" height="2" fill="#5a3a1a"/>
  <rect x="4" y="24" width="2" height="2" fill="#4a2e14"/>
  <rect x="6" y="22" width="2" height="2" fill="#4a2e14"/>
  <!-- 剑柄末端 (深棕) -->
  <rect x="2" y="24" width="2" height="2" fill="#3a2410"/>
  <rect x="4" y="26" width="2" height="2" fill="#3a2410"/>
  <!-- 护手 (深灰/黑) -->
  <rect x="6" y="18" width="2" height="2" fill="#3a3a3a"/>
  <rect x="8" y="16" width="2" height="2" fill="#3a3a3a"/>
  <rect x="6" y="16" width="2" height="2" fill="#2a2a2a"/>
  <rect x="8" y="18" width="2" height="2" fill="#2a2a2a"/>
  <!-- 剑刃 - 钻石色主体 (青蓝) -->
  <rect x="10" y="14" width="2" height="2" fill="#5e9cd0"/>
  <rect x="12" y="12" width="2" height="2" fill="#5e9cd0"/>
  <rect x="14" y="10" width="2" height="2" fill="#5e9cd0"/>
  <rect x="16" y="8" width="2" height="2" fill="#5e9cd0"/>
  <rect x="18" y="6" width="2" height="2" fill="#5e9cd0"/>
  <rect x="20" y="4" width="2" height="2" fill="#5e9cd0"/>
  <rect x="22" y="2" width="2" height="2" fill="#5e9cd0"/>
  <!-- 剑刃 - 高光 (浅蓝白) -->
  <rect x="12" y="10" width="2" height="2" fill="#9ddbf0"/>
  <rect x="14" y="8" width="2" height="2" fill="#9ddbf0"/>
  <rect x="16" y="6" width="2" height="2" fill="#9ddbf0"/>
  <rect x="18" y="4" width="2" height="2" fill="#9ddbf0"/>
  <rect x="20" y="2" width="2" height="2" fill="#9ddbf0"/>
  <!-- 剑刃 - 阴影 (深蓝) -->
  <rect x="10" y="16" width="2" height="2" fill="#3a7ab0"/>
  <rect x="12" y="14" width="2" height="2" fill="#3a7ab0"/>
  <rect x="14" y="12" width="2" height="2" fill="#3a7ab0"/>
  <rect x="16" y="10" width="2" height="2" fill="#3a7ab0"/>
  <rect x="18" y="8" width="2" height="2" fill="#3a7ab0"/>
  <rect x="20" y="6" width="2" height="2" fill="#3a7ab0"/>
  <!-- 剑尖 -->
  <rect x="24" y="0" width="2" height="2" fill="#9ddbf0"/>
  <!-- 剑刃边缘 (深蓝边) -->
  <rect x="8" y="16" width="2" height="2" fill="#2a5a90"/>
  <rect x="10" y="18" width="2" height="2" fill="#2a5a90"/>
</svg>
